name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: retailops
          POSTGRES_PASSWORD: retailops
          POSTGRES_DB: retailops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retailops" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://retailops:retailops@localhost:5432/retailops
      DATABASE_URL_RO: postgresql+psycopg://retailops_ro:retailops_ro@localhost:5432/retailops
      FASTEMBED_CACHE_PATH: ~/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-minilm
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (no database)
        run: pytest tests/unit
      - name: Bootstrap database (schema, read-only role, 1M rows, policy vectors)
        run: sh scripts/bootstrap.sh
      - name: Integration tests (real Postgres, mocked LLM)
        run: pytest tests/integration
      - name: Eval harness self-test (oracle, no API key)
        run: python -m evaluation.run_eval --config oracle --category sql_single --category ambiguous --category adversarial

  smoke-eval:
    # 10-task smoke eval with the real model on every PR, gated against the committed baseline.
    needs: test
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: retailops
          POSTGRES_PASSWORD: retailops
          POSTGRES_DB: retailops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retailops" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://retailops:retailops@localhost:5432/retailops
      DATABASE_URL_RO: postgresql+psycopg://retailops_ro:retailops_ro@localhost:5432/retailops
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Skip when no API key is configured
        id: key
        run: echo "present=${{ env.GEMINI_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        run: sh scripts/bootstrap.sh
      - if: steps.key.outputs.present == 'true'
        name: Smoke eval (fails the PR if task success drops > 3 points below the gate)
        run: |
          if [ -f evaluation/results/gate.json ]; then GATE="--gate evaluation/results/gate.json"; fi
          python -m evaluation.run_eval --config agent --smoke --concurrency 2 $GATE
