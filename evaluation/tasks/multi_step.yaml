# 15 multi-step tasks. Success = gold values mentioned AND expected tools called in order
# (as a subsequence) AND no forbidden tools. "fc.<field>" refers to the gold forecast call.
- id: multi_001
  question: Using a 4-week demand forecast, will current stock of 85123A cover demand?
  gold_sql: SELECT on_hand FROM stock_levels WHERE stock_code = '85123A'
  gold_forecast: {stock_code: 85123A, weeks: 4}
  mention: [r0.on_hand, fc.total_p50]
  expected_tools: [run_sql, forecast_demand]
  unordered_tools: true  # stock and forecast are independent lookups; either order is correct

