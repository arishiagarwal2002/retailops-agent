- id: multi_009
  question: Forecast demand for product 23581 over the next 4 weeks.
  # Must say WHY it will not forecast: an insufficiency word near "history"/"data"/"weeks".
  mention_regex: '(?i)\b(insufficient|not enough|too (?:little|few|short)|fewer|limited|longer|more|only|below|minimum|lacks?|short)\b[^.]{0,60}\b(history|data|weeks?)\b'
  expected_tools: [forecast_demand]
  no_forecast_numbers: true

- id: multi_010
  question: >-
    Which 5 products had the largest drop in units sold last quarter compared with the quarter before?
    Give stock codes.
  gold_sql: >-
    WITH q AS (
      SELECT stock_code,
        SUM(CASE WHEN invoice_date >= '2011-04-01' AND invoice_date < '2011-07-01' THEN quantity ELSE 0 END) AS q2,
        SUM(CASE WHEN invoice_date >= '2011-07-01' AND invoice_date < '2011-10-01' THEN quantity ELSE 0 END) AS q3
      FROM transactions WHERE NOT is_cancellation GROUP BY stock_code)
    SELECT stock_code, q2 - q3 AS drop FROM q ORDER BY drop DESC LIMIT 5
  mention: [all.stock_code]
  expected_tools: [run_sql]

- id: multi_011
  question: >-
    Excluding 'Other', which product category earned the most revenue in 2011, and what was the
    best-selling product by units within it?
  gold_sql:
    - >-
      SELECT p.category, ROUND(SUM(t.quantity*t.unit_price)::numeric,2) AS revenue FROM transactions t
      JOIN products p USING (stock_code) WHERE NOT t.is_cancellation AND p.category <> 'Other'
        AND t.invoice_date >= '2011-01-01' AND t.invoice_date < '2012-01-01'
      GROUP BY 1 ORDER BY revenue DESC LIMIT 1
    - >-
      SELECT t.stock_code, SUM(t.quantity) AS units FROM transactions t JOIN products p USING (stock_code)
      WHERE NOT t.is_cancellation AND p.category = 'Home Decor'
        AND t.invoice_date >= '2011-01-01' AND t.invoice_date < '2012-01-01'
      GROUP BY 1 ORDER BY units DESC LIMIT 1
  mention: [q0.r0.category, q1.r0.stock_code]
  expected_tools: [run_sql]

- id: multi_012
  question: Who was our top customer by revenue in 2011, and how many orders did they place that year?
  gold_sql: >-
    SELECT customer_id, COUNT(DISTINCT invoice_no) AS orders FROM transactions
    WHERE NOT is_cancellation AND customer_id IS NOT NULL
      AND invoice_date >= '2011-01-01' AND invoice_date < '2012-01-01'
    GROUP BY customer_id ORDER BY SUM(quantity*unit_price) DESC LIMIT 1
  mention: [r0.customer_id, r0.orders]
  expected_tools: [run_sql]

