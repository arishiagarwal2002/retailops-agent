# 15 policy tasks. Success = correct verdict (first sentence), required facts mentioned,
# and at least one [Document §x.y] citation. expected_sections feed Recall@5.
- id: pol_001
  question: How long do retail customers have to return an unwanted item?
  expected_sections: [Returns Policy §2.1]
  mention_numbers: [30]
  expected_tools: [search_policy]

- id: pol_002
  question: What is the latest date a customer can return a Christmas gift delivered on 10 December?
  expected_sections: [Returns Policy §2.2]
  mention_any: [31 January, 31st January, January 31]
  expected_tools: [search_policy]

- id: pol_003
  question: A customer wants to return an engraved photo frame because they changed their mind. Can they?
  expected_sections: [Returns Policy §5.1]
  verdict: "no"
  expected_tools: [search_policy]

- id: pol_004
  question: What restocking fee do we charge on change-of-mind trade returns?
  expected_sections: [Returns Policy §6.2]
  mention_numbers: [10]
  mention_any: ["10%", "10 %", "10 percent", "ten percent"]
  expected_tools: [search_policy]

- id: pol_005
  question: How quickly do we have to refund a customer after their return reaches our warehouse?
  expected_sections: [Returns Policy §3.2]
  mention_numbers: [14]
  expected_tools: [search_policy]

- id: pol_006
  question: A customer reports that an item arrived damaged, but it was delivered 4 days ago. What do we do?
  expected_sections: [Returns Policy §4.1, Returns Policy §4.2]
  mention_numbers: [48]
  expected_tools: [search_policy]

- id: pol_007
  question: Do we refund import duties when an international customer returns an item?
  expected_sections: [Returns Policy §7.2]
  verdict: "no"
  expected_tools: [search_policy]

- id: pol_008
  question: Who needs to approve a purchase order worth £7,000?
  expected_sections: [Supplier Terms §1.2]
  mention_any: [director]
  expected_tools: [search_policy]

- id: pol_009
  question: According to our supplier terms, how much should we order when we reorder a product?
  expected_sections: [Supplier Terms §2.2]
  mention_any: [lead time plus two weeks, lead time plus 2 weeks, plus two weeks, plus 2 weeks, "+ 2 weeks"]
  expected_tools: [search_policy]

- id: pol_010
  question: Can we send overstock back to supplier S003, and on what terms?
  expected_sections: [Supplier Terms §4.2]
  verdict: "yes"
  mention_numbers: [15]
  expected_tools: [search_policy]

- id: pol_011
  question: Under UK consumer law, how long does someone who bought online have to cancel their order?
  expected_sections: [UK Consumer Rights Summary §2.1]
  mention_numbers: [14]
  expected_tools: [search_policy]

- id: pol_012
  question: >-
    The customer on invoice 569203 wants to return some unwanted items today. Are they still within
    the return window?
  expected_sections: [Returns Policy §2.1, Returns Policy §1.3]
  verdict: "no"
  expected_tools: [run_sql, search_policy]
  unordered_tools: true  # invoice lookup and policy lookup are independent

- id: pol_013
  question: >-
    The customer on invoice 578680 has changed their mind about their order and wants to return it.
    Can they?
  expected_sections: [Returns Policy §2.2, Returns Policy §2.1]
  verdict: "yes"
  expected_tools: [run_sql, search_policy]
  unordered_tools: true  # invoice lookup and policy lookup are independent

- id: pol_014
  question: >-
    The customer on invoice 574950 wants to return part of their order because they over-ordered.
    Can they still do that?
  expected_sections: [Returns Policy §1.2, Returns Policy §6.1]
  verdict: "no"
  expected_tools: [run_sql, search_policy]
  unordered_tools: true  # invoice lookup and policy lookup are independent

- id: pol_015
  question: A customer says invoice C576375 shows they returned their goods. Should we count it as a return?
